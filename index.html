<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquelarre Beauty Concept Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #000000;
            --card-bg: #0d0d0d;
            --gold: #d4af37;
            --gold-light: #e5c158;
            --white: #ffffff;
            --text-muted: #a1a1aa;
            --border-gold: rgba(212, 175, 55, 0.3);
            --sale-red: #ff4d4d;
        } 

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        } 

        body {
            background-color: var(--bg-black);
            color: var(--white);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 80px;
        } 

        /* HEADER & BANNER */
        header {
            padding: 20px 15px 10px;
            text-align: center;
            background: var(--bg-black);
        } 

        .logo-banner {
            width: 100%;
            max-width: 450px;
            height: auto;
            border-radius: 15px;
            object-fit: contain;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
            margin-bottom: 12px;
        } 

        /* BUSCADOR */
        .search-container {
            max-width: 500px;
            margin: 0 auto 20px;
            padding: 0 20px;
        } 

        .search-box {
            width: 100%;
            padding: 12px 20px;
            background-color: #121212;
            border: 1px solid var(--border-gold);
            border-radius: 25px;
            color: var(--white);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Raleway', sans-serif;
        } 

        .search-box:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        } 

        /* CONTENEDOR PRINCIPAL */
        .main-layout {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        } 

        /* MENÚ DE CATEGORÍAS CON IMÁGENES */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 10px;
        } 

        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        } 

        .category-card:hover, .category-card.active {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
            transform: translateY(-3px);
        } 

        .category-card-img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            background-color: #000;
        } 

        .category-card-name {
            padding: 8px 5px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--white);
            text-transform: uppercase;
            font-family: 'Raleway', sans-serif;
            letter-spacing: 0.5px;
        } 

        .category-card.active .category-card-name {
            color: var(--gold);
        } 

        /* SECCIÓN TÍTULO Y BOTÓN RESTABLECER */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .section-title {
            font-family: 'Raleway', sans-serif;
            color: var(--gold);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        } 

        .reset-category-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-category-btn:hover {
            background: var(--gold);
            color: var(--bg-black);
        }

        /* PRODUCTOS GRID */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        } 

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        } 

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        } 

        .sale-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: var(--sale-red);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #000;
        } 

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        } 

        .product-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--white);
            line-height: 1.2;
        } 

        .product-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        } 

        /* ESTILOS PRECIO Y OFERTAS */
        .product-price-container {
            margin-top: auto;
            padding-top: 5px;
            display: flex;
            flex-direction: column;
        }

        .price-original-striked {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .product-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--gold);
        } 

        .product-price.on-sale {
            color: var(--gold-light);
        }

        .add-cart-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 6px;
            border-radius: 5px;
            font-size: 0.75rem;
            margin-top: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-family: 'Raleway', sans-serif;
        } 

        .add-cart-btn:hover {
            background: var(--gold);
            color: var(--bg-black);
        } 

        /* MODALES */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        } 

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--gold);
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 20px;
        } 

        .close-modal {
            position: absolute;
            top: 10px; right: 15px;
            color: var(--gold);
            font-size: 1.5rem;
            cursor: pointer;
        } 

        .modal-img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #000;
        } 

        .modal-title {
            font-family: 'Raleway', sans-serif;
            color: var(--gold);
            font-size: 1.3rem;
            margin-bottom: 10px;
        } 

        .modal-price {
            font-size: 1.1rem;
            color: var(--white);
            font-weight: 600;
            margin-bottom: 10px;
        } 

        .modal-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 15px;
        } 

        /* ESTILOS ESPECÍFICOS CARRITO */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 60%;
        }

        .cart-item-title {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .cart-item-price {
            font-size: 0.8rem;
            color: var(--gold);
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-btn-qty {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-btn-qty:hover {
            background: var(--gold);
            color: var(--bg-black);
        }

        .cart-total-box {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid var(--gold);
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
        }

        .btn-whatsapp-send {
            width: 100%;
            background: #25d366;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* CARRITO FLOTANTE */
        .cart-float {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gold);
            color: var(--bg-black);
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            z-index: 999;
            font-size: 0.9rem;
            font-family: 'Raleway', sans-serif;
        } 

        /* FOOTER CON ICONOS DORADOS */
        footer {
            background-color: #000000;
            border-top: 1px solid var(--border-gold);
            padding: 30px 20px;
            margin-top: 50px;
        } 

        .footer-container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        } 

        .footer-item {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--gold-light);
            text-decoration: none;
            font-size: 0.9rem;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            font-family: 'Raleway', sans-serif;
        } 

        .footer-icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body> 

    <header>
        <img src="1001735127.png" alt="Aquelarre Beauty Concept Store" class="logo-banner">
    </header> 

    <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="Buscar productos en Aquelarre...">
    </div> 

    <div class="main-layout">
        <div>
            <div class="section-title" style="margin-bottom: 10px;">CATEGORÍAS</div>
            <div class="categories-grid" id="categories-container">
            </div>
        </div>

        <main>
            <div class="section-header">
                <h2 id="current-category-title" class="section-title">TODOS LOS PRODUCTOS</h2>
                <button id="reset-cat-btn" class="reset-category-btn" onclick="selectCategory('TODOS')" style="display:none;">Ver Todo</button>

            <div id="products-container" class="products-grid">
            </div>
        </main>
    </div> 

    <!-- MODAL VISTA DETALLADA PRODUCTO -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img id="modal-img" src="" class="modal-img" loading="lazy">

            <div id="modal-price" class="modal-price"></div>
            <p id="modal-desc" class="modal-desc"></p>
            <button id="modal-add-btn" class="add-cart-btn" style="width:100%; padding:10px;">AÑADIR AL PEDIDO</button>
        </div>
    </div> 

    <!-- MODAL DETALLE DEL CARRITO -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeCartModal()">&times;</span>
            <h3 class="modal-title"><i class="fa-solid fa-basket-shopping"></i> TU PEDIDO</h3>
            <div id="cart-items-list">
                <!-- Se puebla dinámicamente -->
            </div>
            <div class="cart-total-box">
                <span>Total:</span>
                <span id="cart-modal-total">$0 CUP</span>
            </div>
            <button class="btn-whatsapp-send" onclick="sendWhatsAppOrder()">
                <i class="fa-brands fa-whatsapp"></i> ENVIAR A WHATSAPP
            </button>
        </div>
    </div>

    <!-- BOTON CARRITO FLOTANTE -->
    <div id="cart-float" class="cart-float" onclick="openCartModal()" style="display:none;">
        <i class="fa-solid fa-basket-shopping"></i>
        <span id="cart-summary">VER PEDIDO: 0 Productos</span>
    </div> 

    <footer>
        <div class="footer-container">
            <a href="tel:+5354688338" class="footer-item">
                <div class="footer-icon-circle"><i class="fa-solid fa-phone"></i></div>
                <span>+5354688338 (Llamada directa)</span>
            </a>
            <a href="https://wa.me/5350596880" target="_blank" class="footer-item">
                <div class="footer-icon-circle"><i class="fa-brands fa-whatsapp"></i></div>
                <span>+5350596880 (Pedidos por WhatsApp)</span>
            </a>
            <a href="https://maps.google.com/?q=Infante+5B,+Reparto+Militar,+Caney" target="_blank" class="footer-item">
                <div class="footer-icon-circle"><i class="fa-solid fa-location-dot"></i></div>
                <span>Infante 5B, Reparto Militar, Caney</span>
            </a>
        </div>
    </footer> 

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1e7rtGJHivzDHrE9nW7TeQut34pLcptISSeY6IZSVlsQ/export?format=csv';

        const categoryImages = {
            'MISCELANEAS': 'imagenes/miscelaneas.jpg',
            'MANICURAPEDICURA': 'imagenes/manicurapedicura.jpg',
            'GYM': 'imagenes/gym.jpg',
            'SEXSHOP': 'imagenes/sexshop.jpg',
            'BISUTERIA': 'imagenes/bisuteria.jpg',
            'ROPACALZADOACCESORIOS': 'imagenes/ropaca.jpg',
            'ROPACA': 'imagenes/ropaca.jpg',
            'PELUQUERIA': 'imagenes/peluqueria.jpg',
            'MANUALIDADESREGALOSPERSONALIZADOS': 'imagenes/manualidadesrp.jpg',
            'PERFUMERIA': 'imagenes/perfumeria.jpg',
            'MAQUILLAJE': 'imagenes/maquillaje.jpg'
        };

        function normalizeCategoryKey(str) {
            return str
                .toUpperCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[^A-Z0-9]/g, "");
        }

        let allProducts = [];
        let currentCategory = 'TODOS';
        let cart = []; 

        async function loadCatalog() {
            try {
                let response = await fetch(SHEET_URL);
                if (!response.ok) {
                    response = await fetch('articulos.csv');
                }
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error('Error al cargar el catálogo:', error);
            }
        } 

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            if (lines.length < 2) return; 

            allProducts = [];
            
            const firstRow = lines[0];
            const separator = firstRow.includes(';') ? ';' : ',';

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue; 

                const row = line.split(new RegExp(`${separator}(?=(?:(?:[^"]*"){2})*[^"]*$)`))
                                .map(val => val.trim().replace(/^"|"$/g, '')); 

                if (row.length >= 2) {
                    allProducts.push({
                        categoria: row[0] || 'GENERAL',
                        nombre: row[1] || '',
                        precio: row[2] || '0',
                        precioRebaja: row[3] || '',
                        estado: row[4] || '',
                        imagen: row[5] || '',
                        descripcion: row[6] || ''
                    });
                }
            }
            renderCategories();
            renderProducts(currentCategory);
        } 

        function renderCategories() {
            const container = document.getElementById('categories-container');
            const categoriesSet = new Set(allProducts.map(p => p.categoria));
            const categories = Array.from(categoriesSet);

            container.innerHTML = '';

            categories.forEach(cat => {
                const cleanKey = normalizeCategoryKey(cat);
                const imgSrc = categoryImages[cleanKey] || 'https://via.placeholder.com/150/000000/d4af37?text=Aquelarre';

                const card = document.createElement('div');
                card.className = `category-card ${cat === currentCategory ? 'active' : ''}`;
                card.onclick = () => selectCategory(cat);

                card.innerHTML = `
                    <img src="${imgSrc}" alt="${cat}" class="category-card-img" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/150/000000/d4af37?text=Sin+Imagen';">
                    <div class="category-card-name">${cat}</div>
                `;
                container.appendChild(card);
            });
        } 

        function selectCategory(cat) {
            currentCategory = cat;
            
            document.querySelectorAll('.category-card').forEach(card => {
                const name = card.querySelector('.category-card-name').textContent;
                if(name === cat) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });

            document.getElementById('reset-cat-btn').style.display = cat === 'TODOS' ? 'none' : 'block';

            renderProducts(cat);
        }

        function renderProducts(category, filterText = '') {
            const container = document.getElementById('products-container');
            const titleEl = document.getElementById('current-category-title');
            
            titleEl.textContent = category === 'TODOS' ? 'TODOS LOS PRODUCTOS' : category; 

            let filtered = category === 'TODOS' 
                ? allProducts 
                : allProducts.filter(p => p.categoria === category); 

            if (filterText) {
                filtered = filtered.filter(p => p.nombre.toLowerCase().includes(filterText.toLowerCase()));
            } 

            container.innerHTML = '';
            if (filtered.length === 0) {
                container.innerHTML = '<div style="color:var(--text-muted); padding:20px;">No hay artículos disponibles.</div>';
                return;
            } 

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openModal(p);
                
                const imgTag = p.imagen 
                    ? `<img src="${p.imagen}" alt="${p.nombre}" class="product-img" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/150/000000/d4af37?text=Sin+Imagen';">` 
                    : ''; 

                const tieneOferta = p.precioRebaja && parseFloat(p.precioRebaja) > 0 && parseFloat(p.precioRebaja) < parseFloat(p.precio);
                const precioFinal = tieneOferta ? p.precioRebaja : p.precio;

                let htmlPrecio = '';
                let badgeOferta = '';

                if (tieneOferta) {
                    badgeOferta = `<span class="sale-badge">OFERTA</span>`;
                    htmlPrecio = `
                        <div class="product-price-container">
                            <span class="price-original-striked">$${p.precio} CUP</span>
                            <span class="product-price on-sale">$${p.precioRebaja} CUP</span>
                        </div>
                    `;
                } else {
                    htmlPrecio = `
                        <div class="product-price-container">
                            <span class="product-price">$${p.precio} CUP</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${badgeOferta}
                    ${imgTag}
                    <div class="product-info">
                        <div class="product-name">${p.nombre}</div>
                        <div class="product-desc">${p.descripcion}</div>
                        ${htmlPrecio}
                        <button class="add-cart-btn" onclick="addToCart(event, '${p.nombre.replace(/'/g, "\\'")}', '${precioFinal}')">+ AÑADIR</button>
                    </div>
                `;
                container.appendChild(card);
            });
        } 

        document.getElementById('search-input').addEventListener('input', (e) => {
            renderProducts(currentCategory, e.target.value);
        }); 

        function openModal(product) {
            const modal = document.getElementById('product-modal');
            const imgEl = document.getElementById('modal-img');
            
            if (product.imagen) {
                imgEl.src = product.imagen;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            } 

            const tieneOferta = product.precioRebaja && parseFloat(product.precioRebaja) > 0 && parseFloat(product.precioRebaja) < parseFloat(product.precio);
            const precioFinal = tieneOferta ? product.precioRebaja : product.precio;

            document.getElementById('modal-title').textContent = product.nombre;
            
            if (tieneOferta) {
                document.getElementById('modal-price').innerHTML = `
                    <span style="text-decoration: line-through; font-size: 0.9rem; color: var(--text-muted); margin-right: 8px;">$${product.precio} CUP</span>
                    <span style="color: var(--gold-light); font-weight: 700;">$${product.precioRebaja} CUP</span>
                `;
            } else {
                document.getElementById('modal-price').textContent = `$${product.precio} CUP`;
            }

            document.getElementById('modal-desc').textContent = product.descripcion;
            
            const btn = document.getElementById('modal-add-btn');
            btn.onclick = (e) => {
                addToCart(e, product.nombre, precioFinal);
                closeModal();
            }; 

            modal.style.display = 'flex';
        } 

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
        } 

        function addToCart(event, name, price) {
            if (event) event.stopPropagation();
            const numericPrice = parseFloat(price) || 0;
            
            const existingProduct = cart.find(item => item.name === name);
            if (existingProduct) {
                existingProduct.quantity += 1;
            } else {
                cart.push({ name, price: numericPrice, quantity: 1 });
            }
            
            updateCartUI();
        } 

        function changeQuantity(name, delta) {
            const product = cart.find(item => item.name === name);
            if (!product) return;

            product.quantity += delta;
            if (product.quantity <= 0) {
                cart = cart.filter(item => item.name !== name);
            }
            
            updateCartUI();
            renderCartModal();
            
            if (cart.length === 0) {
                closeCartModal();
            }
        }

        function updateCartUI() {
            const floatBtn = document.getElementById('cart-float');
            const summary = document.getElementById('cart-summary');
            
            if (cart.length > 0) {
                const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
                const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                summary.textContent = `VER PEDIDO: ${totalItems} Productos • $${totalPrice} CUP`;
                floatBtn.style.display = 'flex';
            } else {
                floatBtn.style.display = 'none';
            }
        } 

        function openCartModal() {
            if (cart.length === 0) return;
            renderCartModal();
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        function renderCartModal() {
            const listContainer = document.getElementById('cart-items-list');
            listContainer.innerHTML = '';
            
            let total = 0;
            
            cart.forEach(item => {
                const subtotal = item.price * item.quantity;
                total += subtotal;

                const itemRow = document.createElement('div');
                itemRow.className = 'cart-item';
                itemRow.innerHTML = `
                    <div class="cart-item-info">
                        <span class="cart-item-title">${item.name}</span>
                        <span class="cart-item-price">$${item.price} CUP c/u</span>
                    </div>
                    <div class="cart-controls">
                        <button class="cart-btn-qty" onclick="changeQuantity('${item.name.replace(/'/g, "\\'")}', -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="cart-btn-qty" onclick="changeQuantity('${item.name.replace(/'/g, "\\'")}', 1)">+</button>
                    </div>
                `;
                listContainer.appendChild(itemRow);
            });

            document.getElementById('cart-modal-total').textContent = `$${total} CUP`;
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) return;
            
            const phoneNumber = "5350596880";
            let message = "✨ *NUEVO PEDIDO - AQUELARRE BEAUTY* ✨\n\n";
            message += "Hola, me gustaría realizar el siguiente pedido:\n\n";
            
            let total = 0; 

            cart.forEach((item, index) => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                message += `${index + 1}. *${item.name}*\n   └ Cantidad: ${item.quantity} x $${item.price} = *$${subtotal} CUP*\n`;
            }); 

            message += `\n💰 *Total a pagar:* *$${total} CUP*`;
            message += `\n\nQuedo a la espera de la confirmación y los detalles de entrega. ¡Gracias!`;
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
        } 

        loadCatalog();
    </script>
</body>
</html>
