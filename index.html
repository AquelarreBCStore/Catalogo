<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquelarre Beauty Concept Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #000000;
            --card-bg: #0d0d0d;
            --gold: #d4af37;
            --gold-light: #e5c158;
            --white: #ffffff;
            --text-muted: #a1a1aa;
            --border-gold: rgba(212, 175, 55, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--white);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* HEADER & BANNER COMPLETO CON HUMO */
        header {
            padding: 20px 15px 10px;
            text-align: center;
            background: var(--bg-black);
        }

        .logo-banner {
            width: 100%;
            max-width: 450px;
            height: auto;
            border-radius: 15px;
            object-fit: contain;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
            margin-bottom: 12px;
        }

        .store-tagline {
            font-family: 'Raleway', sans-serif;
            font-size: 1.1rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* BUSCADOR */
        .search-container {
            max-width: 500px;
            margin: 0 auto 20px;
            padding: 0 20px;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            background-color: #121212;
            border: 1px solid var(--border-gold);
            border-radius: 25px;
            color: var(--white);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Raleway', sans-serif;
        }

        .search-box:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* CONTENEDOR PRINCIPAL */
        .main-layout {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .main-layout {
                display: grid;
                grid-template-columns: 240px 1fr;
                align-items: start;
            }
        }

        /* CATEGORIAS */
        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-gold);
        }

        .category-btn {
            background: transparent;
            border: none;
            color: var(--white);
            padding: 10px 15px;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-family: 'Raleway', sans-serif;
        }

        .category-btn.active, .category-btn:hover {
            background-color: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            border-left: 3px solid var(--gold);
        }

        /* PRODUCTOS GRID */
        .section-title {
            font-family: 'Raleway', sans-serif;
            color: var(--gold);
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #000;
        }

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .product-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--white);
            line-height: 1.2;
        }

        .product-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--gold);
            margin-top: auto;
            padding-top: 5px;
        }

        .add-cart-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 6px;
            border-radius: 5px;
            font-size: 0.75rem;
            margin-top: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-family: 'Raleway', sans-serif;
        }

        .add-cart-btn:hover {
            background: var(--gold);
            color: var(--bg-black);
        }

        /* MODAL DE PRODUCTO */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--gold);
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 20px;
        }

        .close-modal {
            position: absolute;
            top: 10px; right: 15px;
            color: var(--gold);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #000;
        }

        .modal-title {
            font-family: 'Raleway', sans-serif;
            color: var(--gold);
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .modal-price {
            font-size: 1.1rem;
            color: var(--white);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .modal-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 15px;
        }

        /* CARRITO FLOTANTE */
        .cart-float {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gold);
            color: var(--bg-black);
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            z-index: 999;
            font-size: 0.9rem;
            font-family: 'Raleway', sans-serif;
        }

        /* FOOTER CON ICONOS DORADOS */
        footer {
            background-color: #000000;
            border-top: 1px solid var(--border-gold);
            padding: 30px 20px;
            margin-top: 50px;
        }

        .footer-container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--gold-light);
            text-decoration: none;
            font-size: 0.9rem;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            font-family: 'Raleway', sans-serif;
        }

        .footer-icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <img src="1001735127.png" alt="Aquelarre Beauty Concept Store" class="logo-banner">
        <p class="store-tagline">Beauty Concept Store</p>
    </header>

    <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="Buscar productos en Aquelarre...">
    </div>

    <div class="main-layout">
        <aside class="categories-list" id="categories-container">
            <!-- Categorías dinámicas -->
        </aside>

        <main>
            <h2 id="current-category-title" class="section-title">TODOS LOS PRODUCTOS</h2>
            <div id="products-container" class="products-grid">
                <!-- Productos dinámicos -->
            </div>
        </main>
    </div>

    <!-- MODAL VISTA DETALLADA -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img id="modal-img" src="" class="modal-img">
            <h3 id="modal-title" class="modal-title"></h3>
            <div id="modal-price" class="modal-price"></div>
            <p id="modal-desc" class="modal-desc"></p>
            <button id="modal-add-btn" class="add-cart-btn" style="width:100%; padding:10px;">AÑADIR AL PEDIDO</button>
        </div>
    </div>

    <!-- BOTON CARRITO FLOTANTE -->
    <div id="cart-float" class="cart-float" onclick="sendWhatsAppOrder()" style="display:none;">
        <i class="fa-solid fa-basket-shopping"></i>
        <span id="cart-summary">VER PEDIDO: 0 Productos</span>
    </div>

    <!-- FOOTER CON ICONOS DORADOS -->
    <footer>
        <div class="footer-container">
            <a href="tel:+5354688338" class="footer-item">
                <div class="footer-icon-circle"><i class="fa-solid fa-phone"></i></div>
                <span>+5354688338 (Llamada directa)</span>
            </a>
            <a href="https://wa.me/5350596880" target="_blank" class="footer-item">
                <div class="footer-icon-circle"><i class="fa-brands fa-whatsapp"></i></div>
                <span>+5350596880 (Pedidos por WhatsApp)</span>
            </a>
            <a href="https://maps.google.com/?q=Infante+5B,+Reparto+Militar,+Caney" target="_blank" class="footer-item">
                <div class="footer-icon-circle"><i class="fa-solid fa-location-dot"></i></div>
                <span>Infante 5B, Reparto Militar, Caney</span>
            </a>
        </div>
    </footer>

    <script>
        const SHEET_URL = 'productos.csv';

        let allProducts = [];
        let currentCategory = 'TODOS';
        let cart = [];

        async function loadCatalog() {
            try {
                let response = await fetch(SHEET_URL);
                if (!response.ok) {
                    response = await fetch('productos.csv');
                }
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error('Error al cargar el catálogo:', error);
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            if (lines.length < 2) return;

            allProducts = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const row = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(val => val.trim().replace(/^"|"$/g, ''));

                if (row.length >= 6) {
                    allProducts.push({
                        categoria: row[0] || 'GENERAL',
                        nombre: row[1] || '',
                        precio: row[2] || '0',
                        precioRebaja: row[3] || '',
                        estado: row[4] || '',
                        imagen: row[5] || '',
                        descripcion: row[6] || ''
                    });
                }
            }
            renderCategories();
            renderProducts(currentCategory);
        }

        function renderCategories() {
            const container = document.getElementById('categories-container');
            const categoriesSet = new Set(allProducts.map(p => p.categoria));
            const categories = ['TODOS', ...Array.from(categoriesSet)];

            container.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${cat === currentCategory ? 'active' : ''}`;
                btn.textContent = cat;
                btn.onclick = () => {
                    currentCategory = cat;
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderProducts(cat);
                };
                container.appendChild(btn);
            });
        }

        function renderProducts(category, filterText = '') {
            const container = document.getElementById('products-container');
            const titleEl = document.getElementById('current-category-title');
            
            titleEl.textContent = category === 'TODOS' ? 'TODOS LOS PRODUCTOS' : category;

            let filtered = category === 'TODOS' 
                ? allProducts 
                : allProducts.filter(p => p.categoria === category);

            if (filterText) {
                filtered = filtered.filter(p => p.nombre.toLowerCase().includes(filterText.toLowerCase()));
            }

            container.innerHTML = '';
            if (filtered.length === 0) {
                container.innerHTML = '<div style="color:var(--text-muted); padding:20px;">No hay artículos disponibles.</div>';
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openModal(p);
                
                const imgTag = p.imagen 
                    ? `<img src="${p.imagen}" alt="${p.nombre}" class="product-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/150/000000/d4af37?text=Sin+Imagen';">` 
                    : '';

                card.innerHTML = `
                    ${imgTag}
                    <div class="product-info">
                        <div class="product-name">${p.nombre}</div>
                        <div class="product-desc">${p.descripcion}</div>
                        <div class="product-price">$${p.precio} CUP</div>
                        <button class="add-cart-btn" onclick="addToCart(event, '${p.nombre.replace(/'/g, "\\'")}', '${p.precio}')">+ AÑADIR</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            renderProducts(currentCategory, e.target.value);
        });

        function openModal(product) {
            const modal = document.getElementById('product-modal');
            const imgEl = document.getElementById('modal-img');
            
            if (product.imagen) {
                imgEl.src = product.imagen;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }

            document.getElementById('modal-title').textContent = product.nombre;
            document.getElementById('modal-price').textContent = `$${product.precio} CUP`;
            document.getElementById('modal-desc').textContent = product.descripcion;
            
            const btn = document.getElementById('modal-add-btn');
            btn.onclick = (e) => {
                addToCart(e, product.nombre, product.precio);
                closeModal();
            };

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        function addToCart(event, name, price) {
            event.stopPropagation();
            cart.push({ name, price: parseFloat(price) || 0 });
            updateCartUI();
        }

        function updateCartUI() {
            const floatBtn = document.getElementById('cart-float');
            const summary = document.getElementById('cart-summary');
            
            if (cart.length > 0) {
                const total = cart.reduce((sum, item) => sum + item.price, 0);
                summary.textContent = `VER PEDIDO: ${cart.length} Productos • $${total} CUP`;
                floatBtn.style.display = 'flex';
            } else {
                floatBtn.style.display = 'none';
            }
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) return;
            
            let message = "Hola Aquelarre, quisiera hacer el siguiente pedido:\n\n";
            let total = 0;

            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} - $${item.price} CUP\n`;
                total += item.price;
            });

            message += `\n*Total a pagar: $${total} CUP*`;
            
            const encoded = encodeURIComponent(message);
            window.open(`https://wa.me/5350596880?text=${encoded}`, '_blank');
        }

        loadCatalog();
    </script>
</body>
</html>
