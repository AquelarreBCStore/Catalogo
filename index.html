

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 25px; color: #2c3e50; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
    .card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; text-align: center; border: 1px solid #e1e4e8; }
    .card h3 { font-size: 1.1em; color: #1a1a1a; margin-bottom: 8px; }
    .precio { font-size: 1.2em; font-weight: bold; color: #27ae60; margin-top: 5px; }
    .loading { text-align: center; font-size: 1.1em; color: #7f8c8d; grid-column: 1 / -1; padding: 40px; }
  </style>
</head>
<body>

  <h1>Catálogo de Productos</h1>
  <div id="catalogo" class="grid">
    <div class="loading">Cargando productos...</div>
  </div>

  <script>
    // Carga dinámica del archivo articulos.csv generado por Google Sheets
    fetch('articulos.csv?t=' + new Date().getTime())
      .then(response => {
        if (!response.ok) throw new Error('No se pudo cargar el catálogo');
        return response.text();
      })
      .then(data => {
        const lineas = data.trim().split('\n');
        const contenedor = document.getElementById('catalogo');
        contenedor.innerHTML = '';

        if (lineas.length <= 1) {
          contenedor.innerHTML = '<div class="loading">No hay productos disponibles por el momento.</div>';
          return;
        }

        // Omitir cabecera (primera línea) y renderizar productos
        lineas.slice(1).forEach(linea => {
          if (!linea.trim()) return;
          const columnas = linea.split(',');
          const nombre = columnas[0] ? columnas[0].replace(/^"|"$/g, '') : 'Producto';
          const precio = columnas[1] ? columnas[1].replace(/^"|"$/g, '') : '0';

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h3>${nombre}</h3>
            <div class="precio">$${precio}</div>
          `;
          contenedor.appendChild(card);
        });
      })
      .catch(error => {
        document.getElementById('catalogo').innerHTML = '<div class="loading">Error al cargar el catálogo. Verifica que el archivo articulos.csv exista.</div>';
      });
  </script>

</body>
</html>
